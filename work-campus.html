<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园步道 · 小禾的作品展示网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .block {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 8px;
      color: #0f172a;
    }
    h2 {
      font-size: 22px;
      margin: 20px 0 8px;
      color: #0f172a;
    }
    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      background: #ffffff;
      border-radius: 12px;
      padding: 12px 24px;
      margin-bottom: 20px;
    }
    .site-nav a {
      color: #166534;
      font-size: 15px;
      text-decoration: none;
      padding: 4px 0;
    }
    .site-nav a:hover {
      text-decoration: underline;
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      color: #166534;
      background: #dcfce7;
      border-radius: 4px;
      padding: 1px 8px;
      margin: 0 0 4px;
    }
    .detail-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      margin: 8px 0;
    }
    .caption {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 8px;
    }
    .note {
      font-size: 14px;
      color: #64748b;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 16px 0;
    }
    .btn {
      display: inline-block;
      background: #166534;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-right: 12px;
    }
    .btn:hover { background: #14532d; }
    .link {
      color: #166534;
      font-weight: bold;
    }
    .footer-note {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="container">

    <nav class="site-nav" aria-label="页面导航">
      <a href="index.html">返回首页</a>
      <a href="index.html#works">返回作品区</a>
    </nav>

    <article class="block">
      <p class="tag">校园</p>
      <h1>校园步道</h1>
      <img class="detail-img" src="images/walkway.png" alt="示意插画：树影与弯曲的校园步道">
      <p class="caption">图片描述：示意插画：树影与弯曲的校园步道。</p>

      <h2>作品说明</h2>
      <p>this is campus</p>

      <p class="note">示意标记：本页图片为课程自制示意插画，不是真实摄影作品，也不代表真实经历。</p>

      <a class="btn" href="index.html#works">返回作品区</a>
      <a class="link" href="index.html">返回首页</a>
    </article>

    <footer>
      <p class="footer-note">人物与文字为虚构教学素材，图片为课程自制示意插画；不代表真实摄影作品或真实经历。</p>
    </footer>

  </main>
</body>
</html>
